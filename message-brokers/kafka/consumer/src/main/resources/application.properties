spring.application.name=consumer
server.port=8084

# Kafka topic
kafka.topic.name=demo-topic-2

# PostgreSQL settings
spring.datasource.url=jdbc:postgresql://postgres:5432/consumerdb
spring.datasource.username=macbook
spring.datasource.password=guest

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=kafka-latency-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Allow large messages up to 100MB
spring.kafka.consumer.properties.max.partition.fetch.bytes=104857600
spring.kafka.consumer.properties.fetch.max.bytes=104857600
spring.kafka.consumer.properties.max.request.size=104857600