# ========================
# Spring App Name & Port
# ========================
spring.application.name=consumer
server.port=8081

# ========================
# RabbitMQ Configuration
# ========================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue that the consumer listens to
rabbitmq.queue=demo.queue

# Optional (if your Spring Boot version supports it)
# Allows Spring to handle larger messages
spring.rabbitmq.template.receive-timeout=10000
spring.rabbitmq.cache.channel.size=50

# ========================
# PostgreSQL Configuration
# ========================
spring.datasource.url=jdbc:postgresql://postgres:5432/consumerdb
spring.datasource.username=macbook
spring.datasource.password=guest

# ========================
# JPA / Hibernate Settings
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true