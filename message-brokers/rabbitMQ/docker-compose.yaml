version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: consumerdb
      POSTGRES_USER: macbook
      POSTGRES_PASSWORD: guest
    ports:
      - "5432:5432"

  producer:
    build:
      context: ./producer
    container_name: producer
    depends_on:
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx2G

  consumer:
    build:
      context: ./consumer
    container_name: consumer
    depends_on:
      - rabbitmq
      - postgres
    ports:
      - "8081:8081"
    environment:
      - JAVA_OPTS=-Xmx2G
